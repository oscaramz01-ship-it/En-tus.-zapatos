<!DOCTYPE html>
<html lang="es">
<head>

<title>En Tus Zapatos - Intro 1</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Mukta+Mahee:wght@400;600&display=swap" rel="stylesheet">
<style>
 body{font-family:'Mukta Mahee',sans-serif}
.font-fredoka{font-family:'Fredoka',sans-serif}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.float-1{animation:float 3s ease-in-out infinite}
.float-2{animation:float 3.4s ease-in-out infinite.15s}
.float-3{animation:float 3.8s ease-in-out infinite.3s}
</style>

<body class="bg-[#EDE9FF] min-h-screen w-full flex flex-col items-center">
<main class="w-full max-w-[480px] min-h-screen flex flex-col items-center justify-between px-4 py-6 sm:py-10 relative overflow-hidden">

  <div class="w-full flex flex-col items-center mt-8 sm:mt-12">
    <div class="relative w-full max-w-[360px] h-[140px] sm:h-[162px]">
      <div class="absolute left-[9%] bottom-[-10px] w-[72px] sm:w-[86px] z-[1]">
        <img src="../images/Abuelo M.png" class="w-full object-contain float-1" alt="abuelo">
      </div>
      <div class="absolute left-1/2 -translate-x-1/2 bottom-[4px] w-[120px] sm:w-[148px] z-[2]">

      </div>
      <div class="absolute right-[9%] bottom-[-10px] w-[72px] sm:w-[86px] z-[1]">
        <img src="../images/Abuela M.png" class="w-full object-contain float-3" alt="abuela">
      </div>
    </div>
    <div class="relative -mt-2 z-10">
      <div class="w-[200px] h-[200px] sm:w-[228px] sm:h-[228px] rounded-full bg-white shadow-[0_12px_32px_rgba(79,3,119,0.18)] border-[10px] border-[#E9D6F5] flex items-center justify-center overflow-hidden">

      </div>
    </div>
  </div>

    <!-- BANNER - TEXTO CON AIRE, CENTRADO Y EN CURVA -->
   <div class="relative w-full max-w-[460px] mt-6 sm:mt-8 flex items-center justify-center">
    <img src="../images/banner.png" class="w-full max-w-[400px] sm:max-w-[430px] h-auto object-contain drop-shadow-[0_6px_12px_rgba(109,27,170,0.1)]" alt="banner">
    <div class="absolute inset-0 w-full h-full flex items-center justify-center" style="top: -9.5%;">
      <div class="text-center" style="transform: rotate(-2.5deg); padding-left: 18%; padding-right: 16%;">
        <p class="font-fredoka font-bold text-black text-[11.5px] sm:text-[14.5px] leading-[1.35]" style="transform: translateY(-5px) rotate(-1.5deg);">Una experiencia que ayuda a mejorar</p>
        <p class="font-fredoka font-bold text-black text-[11.5px] sm:text-[14.5px] leading-[1.35]" style="transform: translateY(0px) rotate(-0.5deg);">la empatía, la comunicación y</p>
        <p class="font-fredoka font-bold text-black text-[11.5px] sm:text-[14.5px] leading-[1.35]" style="transform: translateY(5px) rotate(0.5deg);">la convivencia familiar.</p>
      </div>
    </div>

  <!-- BOTON DINAMICO -->
  <div class="w-full flex flex-col items-center gap-5 mt-auto pt-8 pb-4">
